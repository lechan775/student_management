server:
  port: 8080

spring:
  application:
    name: student-management-universe
  # H2 嵌入式数据库（零配置）
  datasource:
    url: jdbc:h2:file:./data/universe_db;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

# JWT 配置
jwt:
  secret: UniverseStudentManagementSecretKey2026VeryLongStringForHMAC256!!
  expiration-ms: 86400000  # 24小时

# 日志
logging:
  level:
    root: WARN
    com.studentmanage.universe: INFO
