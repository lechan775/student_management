# ==================== 多环境配置 ====================
server:
  port: 8080

spring:
  application:
    name: bigbang

  # 默认激活 dev 环境
  profiles:
    active: dev

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # JPA 通用配置
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway 管理 schema，JPA 只做校验
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # Flyway 迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Servlet 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ==================== JWT ====================
jwt:
  secret: BigBangStudentManagementSecretKey2026@VeryLongStringForHS256Algorithm!!
  access-token-expiration: 3600000     # 1 小时
  refresh-token-expiration: 604800000  # 7 天

# ==================== Swagger (Knife4j) ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ==================== 日志 ====================
logging:
  level:
    root: WARN
    com.studentmanage.bigbang: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
